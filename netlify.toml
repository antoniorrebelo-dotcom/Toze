# Configuração do Netlify — não é preciso mexer aqui.
[build]
  command = "npm run build"
  publish = "dist"
  # O site principal está na Hostinger. Para não gastar créditos do Netlify,
  # as publicações automáticas estão desligadas. Para voltar a publicar no
  # Netlify, apague a linha "ignore" abaixo.
  ignore = "exit 0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
